name: Sync Renovate config

on:
  push:
    branches: [ main ]
    paths:
      - templates/renovate.json
      - .github/workflows/sync-renovate.yml
  workflow_dispatch:

jobs:
  copy:
    strategy:
      fail-fast: false
      matrix:
        repository:
          - CreateWiki
          - DataDump
          - DiscordNotifications
          - GlobalNewFiles
          - ImportDump
          - IncidentReporting
          - ManageWiki
          - MatomoAnalytics
          - MirahezeRequests
          - PDFEmbed
          - RemovePII
          - RequestCustomDomain
          - RottenLinks
          - ScheduledCacheExpiry
          - WikiDiscover

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract commit information
        id: extract_commit
        run: |
          echo "short_message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "long_message<<EOF" >> $GITHUB_OUTPUT
          echo "$(git log -1 --pretty=%b)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Copy Renovate config
        env:
          TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT_MESSAGE: |
            Update Renovate config: ${{ steps.extract_commit.outputs.short_message }}

            ${{ steps.extract_commit.outputs.long_message }}

            from ${{ github.repository }} (https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ${{ github.actor != 'Universal-Omega' && format('Co-authored-by: {0}', github.actor) || '' }}
        run: |
          git clone --depth 1 --branch main "https://x-access-token:${TOKEN}@github.com/miraheze/${REPOSITORY}.git" "$RUNNER_TEMP/dst"
          mkdir -p "$RUNNER_TEMP/dst/.github"
          cp templates/renovate.json "$RUNNER_TEMP/dst/.github/renovate.json"
          cd "$RUNNER_TEMP/dst"
          git check-ignore -v .github/renovate.json || true
          git add -f .github/renovate.json
          if git diff --cached --quiet; then
            echo "No changes: .github/renovate.json is already identical on main"
          else
            git config user.name "${GITHUB_ACTOR}"
            git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
            git commit --message "$COMMIT_MESSAGE"
            git push origin main
          fi
